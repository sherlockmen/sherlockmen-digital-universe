" font-size="12" text-anchor="start"><tspan x="54" dy="0">结构化结果输出</tspan></text><text x="492" y="1092" fill="#85a9c2" font-size="10" text-anchor="start"><tspan x="492" dy="0">08</tspan></text><text x="522" y="1092" fill="#d0e2ef" font-size="13" text-anchor="start"><tspan x="522" dy="0">结构化报告生成 → 人工复核界面</tspan></text><text x="522" y="1114" fill="#8da9bd" font-size="12" text-anchor="start"><tspan x="522" dy="0">报告与原始材料关联</tspan></text></svg>