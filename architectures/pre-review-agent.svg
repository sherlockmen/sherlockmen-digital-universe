35" cy="630" r="12" fill="#0a1015" stroke="#afcee3"/><text x="535" y="633.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="535" dy="0">08</tspan></text></g><g data-node="api"><rect x="390" y="28" width="290" height="132" rx="5" fill="#101e29" stroke="#405c70" /><text x="404" y="50" fill="#85a9c2" font-size="10" text-anchor="start"><tspan x="404" dy="0">API</tspan></text><text x="404" y="81" fill="#edf4f8" font-size="17" text-anchor="start"><tspan x="404" dy="0">审核接入 API</tspan></text><text x="404" y="115" fill="#a4bacb" font-size="12" text-anchor="start"><tspan x="404" dy="0">Java / Spring</tspan><tspan x="404" dy="18">文字 / 图片 / 文档 / 录音</tspan><tspan x="404" dy="18">资料提交与业务对接</tspan></text></g><g data-node="pi"><rect x="229" y="240" width="290" height="132" rx="5" fill="#152b3a" stroke="#a6d0eb" /><text x="243" y="262" fill="#85a9c2" font-size="10" text-anchor="start"><tspan x="243" dy="0">RUNTIME</tspan></text><text x="243" y="293" fill="#edf4f8" font-size="17" text-anchor="start"><tspan x="243" dy="0">pi Agent Runtime</tspan></text><text x="243" y="327" fill="#a4bacb" font-size="12" text-anchor="start"><tspan x="243" dy="0">审核任务与场景编排</tspan><tspan x="243" dy="18">调度模型、解析和核验</tspan></text></g><g data-node="model"><rect x="551" y="240" width="290" height="132" rx="5" fill="#101e29" stroke="#405c70" /><text x="565" y="262" fill="#85a9c2" font-size="10" text-anchor="start"><tspan x="565" dy="0">MODEL</tspan></text><text x="565" y="293" fill="#edf4f8" font-size="17" text-anchor="start"><tspan x="565" dy="0">语言与视觉模型</tspan></text><text x="565" y="327" fill="#a4bacb" font-size="12" text-anchor="start"><tspan x="565" dy="0">语义理解 / 视觉理解</tspan><tspan x="565" dy="18">大小模型按任务调度</tspan></text></g><g data-node="parse"><rect x="144" y="452" width="239.33333333333334" height="132" rx="5" fill="#101e29" stroke="#405c70" /><text x="158" y="474" fill="#85a9c2" font-size="10" text-anchor="start"><tspan x="158" dy="0">TOOL</tspan></text><text x="158" y="505" fill="#edf