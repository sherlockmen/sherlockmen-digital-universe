<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1078" role="img" aria-labelledby="title-pre-review-agent desc-pre-review-agent" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-pre-review-agent">事前内容审核 Agent · 发布前审核的功能关系</title><desc id="desc-pre-review-agent">以通用能力说明材料如何进入审核并形成复核参考。；送审素材：通知 / 协议 / 页面；业务参考信息：费用 / 条件 / 业务记录；审核依据：外部要求 / 场景规范；材料整理与理解：内容提取 / 类型识别；发布前内容核验：必要信息 / 表达清晰度：多份材料对照；检查结论与说明：问题位置 / 依据：修订参考；业务人员复核：核对材料 / 判断调整方向；送审素材 · 提取可核查内容 · 材料整理与理解；材料整理与理解 · 按场景检查 · 发布前内容核验；业务参考信息 · 对照业务信息 · 发布前内容核验；审核依据 · 匹配检查条件 · 发布前内容核验；发布前内容核验 · 整理发现与依据 · 检查结论与说明；检查结论与说明 · 提供复核参考 · 业务人员复核</desc><defs><marker id="arrow-pre-review-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#bedbf2"/></marker></defs><path d="M146 158 C146 203,390 203,390 248" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-pre-review-agent)"/><text x="268" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">提取可核查内容</text><path d="M390 382 C390 427,390 427,390 472" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-pre-review-agent)"/><text x="390" y="417" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">按场景检查</text><path d="M390 158 V203 H12 V427 H390 V472" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="201" y="417" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">对照业务信息</text><path d="M634 158 V203 H768 V427 H390 V472" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="579" y="417" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">匹配检查条件</text><path d="M390 606 C390 651,390 651,390 696" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-pre-review-agent)"/><text x="390" y="641" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">整理发现与依据</text><path d="M390 830 C390 875,390 875,390 920" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-pre-review-agent)"/><text x="390" y="865" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">提供复核参考</text><g><rect x="36" y="24" width="220" height="134" rx="4" fill="#0c161f" stroke="#3a5060"/><text x="146" y="54" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="146" dy="0">送审素材</tspan></text><text x="146" y="83" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="146" dy="0">通知 / 协议 / 页面</tspan></text></g><g><rect x="280" y="24" width="220" height="134" rx="4" fill="#0c161f" stroke="#3a5060"/><text x="390" y="54" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="390" dy="0">业务参考信息</tspan></text><text x="390" y="83" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="390" dy="0">费用 / 条件 / 业务记录</tspan></text></g><g><rect x="524" y="24" width="220" height="134" rx="4" fill="#0c161f" stroke="#3a5060"/><text x="634" y="54" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="634" dy="0">审核依据</tspan></text><text x="634" y="83" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="634" dy="0">外部要求 / 场景规范</tspan></text></g><g><rect x="280" y="248" width="220" height="134" rx="4" fill="#0c161f" stroke="#3a5060"/><text x="390" y="278" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="390" dy="0">材料整理与理解</tspan></text><text x="390" y="307" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="390" dy="0">内容提取 / 类型识别</tspan></text></g><g><rect x="280" y="472" width="220" height="134" rx="4" fill="#122332" stroke="#bedbf2"/><text x="390" y="502" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="390" dy="0">发布前内容核验</tspan></text