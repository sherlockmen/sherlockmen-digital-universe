<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1166" role="img" aria-labelledby="title-pre-review-agent desc-pre-review-agent" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-pre-review-agent">事前内容审核 Agent · pi 编排、模型与规则检索</title><desc id="desc-pre-review-agent">基于 pi 组织审核任务，按材料类型调用模型、解析及核验能力；图示为逻辑组件，具体版本与部署拓扑未展开。；接口接入：审核接入 API，Java / Spring，文字 / 图片 / 文档 / 录音，资料提交与业务对接；执行与推理：pi Agent Runtime，审核任务与场景编排，调度模型、解析和核验；语言与视觉模型，语义理解 / 视觉理解，大小模型按任务调度；解析与核验：材料解析工具，OCR / ASR / NLP，附件信息提取与分类；RAG 与规则核验，检索审核依据，规则匹配与一致性检查；审核知识与业务资料，外部规范 / 场景规则，业务参考数据；结果与复核：结构化报告生成，结论 / 检查项 / 依据，修改建议与材料引用；审核结果 API，Java / Spring，向业务流程反馈结果；人工复核界面，TypeScript / React，查看问题与原始材料；01 审核接入 API → pi Agent Runtime：送审资料 / 审核任务；02 pi Agent Runtime ↔ 语言与视觉模型：模型请求 / 理解与推理结果；03 pi Agent Runtime ↔ 材料解析工具：工具调用 / 解析结果；04 pi Agent Runtime ↔ RAG 与规则核验：检索与核验请求 / 依据返回；05 审核知识与业务资料 → RAG 与规则核验：规则与参考数据读取；06 pi Agent Runtime → 结构化报告生成：检查结果 / 依据与引用；07 结构化报告生成 → 审核结果 API：结构化结果输出；08 结构化报告生成 → 人工复核界面：报告与原始材料关联</desc><defs><marker id="arrow-pre-review-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="access"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">接口接入</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">JAVA / SPRING</tspan><tspan x="24" dy="14.5">API</tspan></text></g><g data-layer="runtime"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y="286" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">执行与推理</tspan></text><text x="24" y="334" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">AGENT / MODEL</tspan></text></g><g data-layer="tools"><rect x="130" y="440" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="472" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">03</tspan></text><text x="24" y="498" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">解析与核验</tspan></text><text x="24" y="546" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">TOOLS / RAG</tspan></text></g><g data-layer="output"><rect x="130" y="652" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="684" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">04</tspan></text><text x="24" y="710" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">结果与复核</tspan></text><text x="24" y="758" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">OUTPUT / UI</tspan></text></g><g data-edge="01"><path d="M517 160 V191 H356 V240" fill="none" stroke="#afcee3" stroke-width="1.4"   marker-end="url(#arrow-pre-review-agent)"/><circle cx="436.5" cy="191" r="12" fill="#0a1015" stroke="#afcee3"/><text x="436.5" y="194.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="436.5" dy="0">01</tspan></text></g><g data-edge="02"><path d="M519 306 H551" fill="none" stroke="#6f91aa" stroke-width="1.4" stroke-dasharray="5 4" marker-start="url(#arrow-pre-review-agent)" marker-end="url(#arrow-pre-review-agent)"/><circle cx="535" cy="287" r="12" fill="#0a1015" stroke="#6f91aa"/><text x="535" y="290.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="535" dy="0">02</tspan></text></g><g data-edge="03"><path d="M392 372 V421 H281.6666666666667 V452" fill="none" stroke="#6f91aa" stroke-width="1.4" stroke-dasharray="5 4" marker-start="url(#arrow-pre-review-agent)" marker-end="url(