<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1360" viewBox="0 0 1080 1360" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title-wage-payment-complaints" aria-describedby="desc-wage-payment-complaints" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-wage-payment-complaints">欠薪欠款投诉应用 · 投诉提交的界面、应用与数据访问分层</title><desc id="desc-wage-payment-complaints">以通用分层组件表达提交请求和响应：界面与请求适配连接 API，应用服务组织记录组装与保存，数据访问保持产品无关的逻辑边界。；界面与请求：投诉填报界面，TypeScript / React，欠薪 / 欠款内容输入，提交响应展示；提交请求适配，TypeScript，表单请求 / 响应处理；API 接入：投诉接入 API，Java / Spring，请求接收 / 内容解析；应用处理：投诉提交应用服务，Java / Spring，提交处理 / 保存调用；投诉记录组装，投诉内容 / 提交信息，业务记录组织；数据访问与记录：投诉数据访问接口，Java / Spring，记录保存 / 保存结果；投诉记录，投诉内容与提交信息；01 投诉填报界面 ↔ 提交请求适配：表单提交 / 提交响应；02 提交请求适配 ↔ 投诉接入 API：提交请求 / API 响应；03 投诉接入 API ↔ 投诉提交应用服务：投诉内容 / 处理结果；04 投诉提交应用服务 ↔ 投诉记录组装：记录组装 / 记录对象；05 投诉提交应用服务 ↔ 投诉数据访问接口：记录保存 / 保存结果；06 投诉数据访问接口 → 投诉记录：投诉记录写入</desc><style>.architecture-packet{pointer-events:none}svg[data-motion="paused"] .architecture-packet{visibility:hidden}@media(prefers-reduced-motion:reduce){.architecture-packet{display:none}}</style><defs><marker id="arrow-wage-payment-complaints" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="ui"><rect x="130" y="76" width="810" height="216" rx="6" fill="#0b141d" stroke="#253541"/><text x="144" y="106" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="144" dy="0">01 / 界面与请求</tspan></text><text x="926" y="105" fill="#7994a8" font-size="10" text-anchor="end"><tspan x="926" dy="0">REACT / TYPESCRIPT</tspan></text></g><g data-layer="access"><rect x="130" y="356" width="810" height="200" rx="6" fill="#0b141d" stroke="#253541"/><text x="144" y="386" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="144" dy="0">02 / API 接入</tspan></text><text x="926" y="385" fill="#7994a8" font-size="10" text-anchor="