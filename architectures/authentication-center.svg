<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" role="img" aria-labelledby="title-authentication-center desc-authentication-center" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-authentication-center">业务认证平台 · 认证服务与外部接口适配</title><desc id="desc-authentication-center">Java / Spring 提供认证接口、业务处理及外部系统适配；外部协议、存储产品和部署拓扑未展开。；业务接入：业务调用方，提交业务认证资料；认证接入接口，Java / Spring，认证请求与结果返回；认证处理：业务认证服务，Java / Spring，企业 / 借贷 / 商户认证，认证处理与结果组织；外部系统适配，Java / Spring 业务适配，外部业务系统对接；外部能力：外部业务系统，相关业务信息交互；01 业务调用方 ↔ 认证接入接口：认证资料 / 认证结果；02 认证接入接口 ↔ 业务认证服务：认证处理调用 / 返回；03 业务认证服务 ↔ 外部系统适配：业务信息交互 / 返回；04 外部系统适配 ↔ 外部业务系统：外部系统调用 / 业务信息</desc><defs><marker id="arrow-authentication-center" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="access"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">业务接入</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">BUSINESS / API</tspan></text></g><g data-layer="service"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y="286" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">认证处理</tspan></text><text x="24" y="334" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">JAVA / SPRING</tspan></text></g><g data-layer="external"><rect x="130" y="440" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="472" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">0