<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1124" role="img" aria-labelledby="title-customer-service-digital-human" aria-describedby="desc-customer-service-digital-human" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-customer-service-digital-human">客服交互与数字人接入 · 客户端交互与服务集成</title><desc id="desc-customer-service-digital-human">光点仅示意调用与数据流向，非实时数据。；客户界面分别接入推荐、转写和数字人能力；WebSocket 连接会话服务，工单与知识通过业务接口协同，数字人引擎按能力边界抽象。；客户端呈现：客户服务界面，TypeScript / React，文字 / 语音输入，在线客服入口；数字人呈现，交互内容可视化呈现；交互服务：问题推荐服务，猜你想问 / 咨询方向；语音转写服务，语音输入转文本；在线会话服务，Java / Spring，在线咨询业务与消息处理；服务集成：共享工单接口，Java / Spring 业务接口，服务受理支持；共享知识服务，Java / Spring 业务接口，问题与话术查询；01 客户服务界面 ↔ 问题推荐服务：推荐请求 / 问题列表；02 客户服务界面 ↔ 语音转写服务：语音数据 / 转写文本；03 客户服务界面 ↔ 在线会话服务：WebSocket · 咨询消息 / 回答内容；04 客户服务界面 → 数字人呈现：数字人接入；05 在线会话服务 → 共享工单接口：服务受理接口调用；06 在线会话服务 ↔ 共享知识服务：问题查询 / 回答参考</desc><style>.architecture-packet{pointer-events:none}svg[data-motion="paused"] .architecture-packet{visibility:hidden}@media(prefers-reduced-motion:reduce){.architecture-packet{display:none}}</style><defs><marker id="arrow-customer-service-digital-human" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="ui"><rect x="130" y="76" width="810" height="200" rx="6" fill="#0b141d" stroke="#253541"/><text x="144" y="106" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="144" dy="0">01 / 客户端呈现</tspan></text><text x="926" y="105" fill="#7994a8" font-size="10" text-anchor="end"><tspan x="926" dy="0">REACT / TYPESCRIPT</tspan></text></g><g data-layer="service"><rect x="130" y="364" width="810" height="200" rx="6" fill="#0b141d" stroke="#253541"/><text x="144" y="394" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="144" dy="0">02 / 交互服务</tspan></text><text x="926" y="393" fill="#7994a8" font-size="10" text-anchor="end"><tspan x="926" dy="0">RECOMMEND / ASR</tspan></text