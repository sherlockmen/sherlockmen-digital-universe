<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 892" role="img" aria-labelledby="title-customer-service-digital-human desc-customer-service-digital-human" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-customer-service-digital-human">客户服务入口与数字人 · 客户端交互与服务集成</title><desc id="desc-customer-service-digital-human">按已确认能力抽象组件职责；框架、存储与通信选型待补充。；客户端呈现：客户服务界面，文字 / 语音输入，在线客服入口；数字人呈现，交互内容可视化呈现；交互服务：问题推荐服务，猜你想问 / 咨询方向；语音转写服务，语音输入转文本；在线会话服务，承接在线咨询内容；服务集成：共享工单接口，服务受理支持；共享知识服务，问题与话术查询；01 客户服务界面 ↔ 问题推荐服务：推荐请求 / 问题列表；02 客户服务界面 ↔ 语音转写服务：语音数据 / 转写文本；03 客户服务界面 ↔ 在线会话服务：咨询消息 / 回答内容；04 客户服务界面 → 数字人呈现：数字人接入；05 在线会话服务 → 共享工单接口：服务受理接口调用；06 在线会话服务 ↔ 共享知识服务：问题查询 / 回答参考</desc><defs><marker id="arrow-customer-service-digital-human" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="ui"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">客户端呈现</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">UI / AVATAR</tspan></text></g><g data-layer="service"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y="286" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">交互服务</tspan></text><text x="24" y="334" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">RECOMMEND / ASR</tspan></text></g><g data-layer="shared"><rect x="130" y="440" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="472" fill="#6f92aa" font-size="