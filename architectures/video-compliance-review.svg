<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1302" role="img" aria-labelledby="title-video-compliance-review desc-video-compliance-review" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-video-compliance-review">视频营销合规分析 · 视频营销分析的能力示意</title><desc id="desc-video-compliance-review">依据方案与演示提炼功能关系，展示范围不代表正式上线范围。；直播视频：画面 / 口播；商品与宣传资料：详情 / 营销说明；核查标准：适用要求 / 检查条件；多来源内容理解：视频内容与资料对应；营销表达核验：信息对照 / 疑点识别；问题片段定位：时间位置 / 相关证据；分析结果说明：疑点 / 依据 / 调整建议；审核人员核对：回看片段 / 研判线索；直播视频 · 理解视频内容 · 多来源内容理解；商品与宣传资料 · 对应商品信息 · 多来源内容理解；多来源内容理解 · 比对不同来源 · 营销表达核验；核查标准 · 适用检查要求 · 营销表达核验；营销表达核验 · 关联问题与证据 · 问题片段定位；问题片段定位 · 形成可回看的说明 · 分析结果说明；分析结果说明 · 辅助复核 · 审核人员核对</desc><defs><marker id="arrow-video-compliance-review" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#bedbf2"/></marker></defs><path d="M146 158 C146 203,390 203,390 248" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-video-compliance-review)"/><text x="268" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">理解视频内容</text><path d="M390 158 C390 203,390 203,390 248" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-video-compliance-review)"/><text x="390" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">对应商品信息</text><path d="M390 382 C390 427,390 427,390 472" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-video-compliance-review)"/><text x="390" y="417" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">比对不同来源</text><path d="M634 158 V203 H768 V427 H390 V472" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="579" y="417" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="