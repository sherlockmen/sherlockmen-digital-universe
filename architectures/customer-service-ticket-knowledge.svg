<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1038" role="img" aria-labelledby="title-customer-service-ticket-knowledge" aria-describedby="desc-customer-service-ticket-knowledge" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-customer-service-ticket-knowledge">客服工单与知识 API · 工单接口与知识存储</title><desc id="desc-customer-service-ticket-knowledge">光点仅示意调用与数据流向，非实时数据。；Java / Spring 提供并列的工单和知识接口；渠道按业务动作调用，工单记录与话术知识分别承担状态保存和回答支持。；渠道集成：客服渠道调用方，在线 / 语音 / 客户入口，坐席受理操作；应用接口：工单业务接口，Java / Spring，服务下单 / 协同流转，处理进度查询；知识查询接口，Java / Spring，问题输入 / 话术返回；业务数据：工单记录，服务受理 / 处理记录；话术知识库，客服回答内容；01 客服渠道调用方 ↔ 工单业务接口：服务下单 / 处理跟踪；02 客服渠道调用方 ↔ 知识查询接口：话术查询 / 回答内容；03 工单业务接口 → 工单记录：工单数据写入；04 知识查询接口 ↔ 话术知识库：话术数据读取</desc><style>.architecture-packet{pointer-events:none}svg[data-motion="paused"] .architecture-packet{visibility:hidden}@media(prefers-reduced-motion:reduce){.architecture-packet{display:none}}</style><defs><marker id="arrow-customer-service-ticket-knowledge" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="access"><rect x="130" y="76" width="810" height="200" rx="6" fill="#0b141d" stroke="#253541"/><text x="144" y="106" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="144" dy="0">01 / 渠道集成</tspan></text><text x="926" y="105" fill="#7994a8" font-size="10" text-anchor="end"><tspan x="926" dy="0">MULTI CHANNEL</tspan></text></g><g data-layer="service"><rect x="130" y="340" width="810" height="200" rx="6" fill="#0b141d" stroke="#253541"/><text x="144" y="370" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="144" dy="0">02 / 应用接口</tspan></text><text x="926" y="369" fill="#7994a8" font-size="10" text-anchor="end"><tspan x="926" dy="0">JAVA / SPRING API</tspan></text></g><g data-layer="data"><rect x="130" y="604" width="810" height="200" rx="6" fill="#0b141d" stroke="#253541"/><text x="144