<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" role="img" aria-labelledby="title-customer-service-ticket-knowledge desc-customer-service-ticket-knowledge" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-customer-service-ticket-knowledge">客服工单与知识服务 · 工单接口与知识存储</title><desc id="desc-customer-service-ticket-knowledge">Java / Spring 提供共用工单和知识接口；调用方按渠道抽象，数据库、检索产品及部署拓扑未展开。；渠道集成：客服渠道调用方，在线 / 语音 / 客户入口，坐席受理操作；应用接口：工单创建接口，Java / Spring，服务受理信息 / 工单创建；知识查询接口，Java / Spring，问题输入 / 话术返回；业务数据：工单记录，服务下单数据；话术知识库，客服回答内容；01 客服渠道调用方 → 工单创建接口：服务下单请求；02 客服渠道调用方 ↔ 知识查询接口：话术查询 / 回答内容；03 工单创建接口 → 工单记录：工单数据写入；04 知识查询接口 ↔ 话术知识库：话术数据读取</desc><defs><marker id="arrow-customer-service-ticket-knowledge" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="access"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">渠道集成</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">MULTI CHANNEL</tspan></text></g><g data-layer="service"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y="286" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">应用接口</tspan></text><text x="24" y="334" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">JAVA / SPRING</tspan><tspan x="24" dy="14.5">API</tspan></text></g><g data-layer="data"><rect x="130" y="440" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="472" fill="#6f92aa" fo