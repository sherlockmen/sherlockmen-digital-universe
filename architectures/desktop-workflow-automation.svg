<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" role="img" aria-labelledby="title-desktop-workflow-automation desc-desktop-workflow-automation" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-desktop-workflow-automation">桌面流程自动化 · 流程执行器与桌面控制</title><desc id="desc-desktop-workflow-automation">按已确认能力抽象组件职责；框架、存储与通信选型待补充。；流程配置：流程定义，重复任务的操作步骤，电脑操作参数；执行与控制：流程执行器，按步骤驱动任务，生成电脑操作指令；桌面控制适配，点击等输入事件，电脑操作能力封装；目标应用：目标桌面应用，接收操作事件，执行对应应用行为；01 流程定义 → 流程执行器：步骤与操作参数；02 流程执行器 → 桌面控制适配：电脑控制调用；03 桌面控制适配 → 目标桌面应用：点击等操作事件</desc><defs><marker id="arrow-desktop-workflow-automation" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="config"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">流程配置</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">STEPS / PARAMS</tspan></text></g><g data-layer="runtime"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y="286" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">执行与控制</tspan></text><text x="24" y="334" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">RUNTIME / TOOL</tspan></text></g><g data-layer="target"><rect x="130" y="440" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="472" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">03</tspan></text><text x="24" y="498" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">目标应用</tspan></text><text x="24" y="546" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">DESKTOP</tspan></text></g><g data-edge="01"><path d="M517 160 V191 H356 V240" fill="none" stroke="#afcee3" stroke-width="1.4"   marker-end="url(#arrow-desktop-workflow-automation)"/><circle cx="436.5" cy="191" r="12" fill="#0a1015" stroke="#afcee3"/><text x="436.5" y="194.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="436.5" dy="0">01</tspan></text></g><g data-edge="02"><path d="M519 306 H551" fill="none" stroke="#6f91aa" stroke-width="1.4" stroke-dasharray="5 4"  marker-end="url(#arrow-desktop-workflow-automation)"/><circle cx="535" cy="287" r="12" fill="#0a1015" stroke="#6f91aa"/><text x="535" y="290.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="535" dy="0">02</tspan></text></g><g data-edge="03"><path d="M714 372 V421 H553 V452" fill="none" stroke="#afcee3" stroke-width="1.4"   marker-end="url(#arrow-desktop-workflow-automation)"/><circle cx="633.5" cy="421" r="12" fill="#0a1015" stroke="#afcee3"/><text x="633.5" y="424.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="633.5" dy="0">03</tspan></text></g><g data-node="steps"><rect x="390" y="28" width="290" height="132" rx="5" fill="#101e29" stroke="#405c70" /><path d="M404 47 q5 -5 10 0 v9 q-5 5 -10 0 z m0 -5 q5 5 10 0" fill="none" stroke="#85a9c2"/><text x="421" y="50" fill="#85a9c2" font-size="10" text-anchor="start"><tspan x="421" dy="0">DATA</tspan></text><text x="404" y="81" fill="#edf4f8" font-size="17" text-anchor="start"><tspan x="404" dy="0">流程定义</tspan></text><text x="404" y="115" fill="#a4bacb" font-size="12" text-anchor="start"><tspan x="404" dy="0">重复任务的操作步骤</tspan><tspan x="404" dy="18">电脑操作参数</tspan></text></g><g data-node="executor"><rect x="229" y="240" width="290" height="132" rx="5" fill="#152b3a" stroke="#a6d0eb" /><text x="243" y="262" fill="#85a9c2" font-size="10" text-anchor="start"><tspan x="243" dy="0">RUNTIME</tspan>