<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 854" role="img" aria-labelledby="title-order-review-agent desc-order-review-agent" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-order-review-agent">事后审单定责 Agent · 新架构研究方案</title><desc id="desc-order-review-agent">复用现有业务系统，研究由 Agent 组织动态调查的审核架构；运行观测与评测按阶段接通。；现有 Java 系统：工单 / 附件 / 权限：业务查询 / 人工复核；DeepSeek Harness：执行循环 / 上下文：模型调用 / 工具调用；审核方法与口径：SOP / 专业 Skill：Policy / 已确认案例；业务与证据工具：原文读取 / 系统查询：日期与金额计算；智能审单服务：诉求分析 / 文件索引：动态调查 / 共享事实：逐项定责 / 整单校验；定责建议报告：事实 / 定责口径：证据引用 / 判断理由；Langfuse 评测方案：运行观测 / 人工标注：批量实验 / 回归评测；人工复核：有责必经复核：疑难交业务专家；现有 Java 系统 · 工单与业务能力 · 智能审单服务；DeepSeek Harness · 运行支撑 · 智能审单服务；审核方法与口径 · 调查与定责依据 · 智能审单服务；业务与证据工具 · 取证与计算 · 智能审单服务；智能审单服务 · 新线索或冲突触发补查 · 智能审单服务；智能审单服务 · 形成建议 · 定责建议报告；智能审单服务 · 分阶段接通 · Langfuse 评测方案；定责建议报告 · 有责 / 疑难工单 · 人工复核</desc><defs><marker id="arrow-order-review-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#bedbf2"/></marker></defs><path d="M106.5 158 C106.5 203,390 203,390 248" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-order-review-agent)"/><text x="248.25" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">工单与业务能力</text><path d="M295.5 158 C295.5 203,390 203,390 248" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="342.75" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">运行支撑</text><path d="M484.5 158 C484.5 203,390 203,390 248" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="437.25" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">调查与定责依据</text><path d="M673.5 158 C673.5 203,390 203,390 248" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dash