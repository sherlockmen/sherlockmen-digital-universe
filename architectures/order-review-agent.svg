<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1228" role="img" aria-labelledby="title-order-review-agent desc-order-review-agent" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-order-review-agent">事后投诉责任审核 Agent · Agent Runtime 与领域插件</title><desc id="desc-order-review-agent">图示为新架构研究：复用 Java 业务接口，基于 DeepSeek Harness 组织模型与工具；运行观测和离线评测按阶段规划。；业务接入：Java 业务系统，复用，工单 / 附件 / 权限，受控查询与结果接口；执行与推理：DeepSeek Harness，研究，执行循环 / 上下文管理，模型调用与插件装载；DeepSeek 推理模型，研究，材料理解 / 调查规划，推理结果返回运行底座；领域扩展：证据工具插件，研究，附件原文 / 业务查询，日期与金额计算；案件状态与文件索引，研究，共享事实 / 原文定位，引用位置与待查事项；Skill / Policy，研究，专业核查方法 / 规则口径，按版本装载领域知识；结果与观测：程序化提交检查，研究，计算与引用检查，审核建议结构化输出；复核与结果管理，复用，人工核对审核建议，业务系统承载正式结果；Langfuse 与离线评测，规划，运行记录 / 样本标注，批量实验与回归评估；01 Java 业务系统 → DeepSeek Harness：审核任务 / 案件上下文；02 DeepSeek Harness ↔ DeepSeek 推理模型：推理请求 / 模型输出；03 DeepSeek Harness ↔ 证据工具插件：工具调用 / 证据返回；04 证据工具插件 ↔ Java 业务系统：受控查询 / 业务记录；05 DeepSeek Harness ↔ 案件状态与文件索引：索引读取 / 事实更新；06 Skill / Policy → DeepSeek Harness：专业 Skill 与 Policy 版本装载；07 DeepSeek Harness → 程序化提交检查：审核建议 / 证据引用；08 程序化提交检查 → 复核与结果管理：校验后的结构化建议；09 DeepSeek Harness → Langfuse 与离线评测：执行记录 / 评测样本（规划）</desc><defs><marker id="arrow-order-review-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="access"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">业务接入</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">JAVA / API</tspan></text></g><g data-layer="runtime"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y="286" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">执行与推理</tspan></text><text x="24" y="334" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">AGENT RUNTIME</tspan></text></g><g data-layer="plugins"><rect x="130" y="440" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="472" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">03</tspan></text><text x="24" y="498" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">领域扩展</tspan></text><text x="24" y="546" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">TOOLS / STATE</tspan></text></g><g data-layer="output"><rect x="130" y="652" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="684" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">04</tspan></text><text x="24" y="710" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">结果与观测</tspan></text><text x="24" y="758" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">OUTPUT / EVAL</tspan></text></g><g data-edge="01"><path d="M517 160 V191 H356 V240" fill="none" stroke="#afcee3" stroke-width="1.4"   marker-end="url(#arrow-order-review-agent)"/><circle cx="436.5" cy="191" r="12" fill="#0a1015" stroke="#afcee3"/><text x="436.5" y="194.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="436.5" dy="0">01</tspan></text></g><g data-edge="02"><path d="M519 306 H551" fill="none" stroke="#6f91aa" stroke-width="1.4" stroke-dasharray="5 4" marker-start="url(#arrow-order-review-agent)" marker-end="url(#arrow-order-review-agent)"/><circle cx="535" cy="287" r="12" fill="#0a1015" stroke="#6f91aa"/><text x="535" y="290.5" fill="#c1d9ea" font-size="10" text-anchor="middle"><tspan x="535" dy="0">02</tspan></text></g><g data-edge="03"><path d="M392 372 V421 H281.6666666666667 V452" fill="none" stroke="#6f91aa"