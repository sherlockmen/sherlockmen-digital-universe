<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="1248" viewBox="0 0 1216 1248" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title-in-process-quality-control" aria-describedby="desc-in-process-quality-control" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:transparent"><title id="title-in-process-quality-control">事中数据汇聚与指标驾驶舱 · 批量入湖与指标计算</title><desc id="desc-in-process-quality-control">数据按周期批量入湖，经加工与多维计算输出指标结果集，再由 React 展示；同步链路为非实时，新版下钻保留设计方案范围。；源端数据：多业务源系统，服务记录 / 诉求明细；源端统计处理，明细汇总为统计数据；接入与存储：定时采集与上传，按指标周期同步，批量数据入湖；数据湖表，明细表 / 统计表；数据开发：数据加工，单表统计 / 多表运算，跨来源数据汇总；指标计算，多维聚合 / 占比计算，日数据与月度统计；指标与可视化：指标结果集，周期服务量与结构指标；驾驶舱可视化，TypeScript / React，服务量与结构图表，新版下钻：设计方案；01 多业务源系统 → 源端统计处理：服务明细；02 源端统计处理 → 定时采集与上传：统计级数据；03 多业务源系统 → 定时采集与上传：清单级数据；04 定时采集与上传 → 数据湖表：周期批量入湖；05 数据湖表 → 数据加工：湖表读取；06 数据加工 → 指标计算：加工结果；07 指标计算 → 指标结果集：指标计算结果；08 指标结果集 → 驾驶舱可视化：指标数据展示</desc><style>.architecture-packet{pointer-events:none}svg[data-motion="paused"] .architecture-packet{visibility:hidden}@media(prefers-reduced-motion:reduce){.architecture-packet{display:none}}</style><defs><marker id="arrow-in-process-quality-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#91bcd7"/></marker></defs><g data-layer="sources"><rect x="132" y="28" width="1016" height="172" rx="10" fill="#0d1720" fill-opacity=".86" stroke="#263847"/><text x="24" y="58" fill="#81afcc" font-size="10" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="87" fill="#d0e2ef" font-size="14" text-anchor="start"><tspan x="24" dy="0">源端数据</tspan></text><text x="24" y="168" fill="#6f92aa" font-size="9" text-anchor="start"><tspan x="24" dy="0">SYSTEM /</tspan><tspan x="24" dy="13">STATISTICS</tspan></text></g><g data-layer="ingestion"><rect x="132" y="256" width="1016" height="172" rx="10" fill="#0d1720" fill-opacity=".86" stroke="#263847"/><text x="24" y="286" fill="#81afcc" f