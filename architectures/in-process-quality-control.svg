<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1078" role="img" aria-labelledby="title-in-process-quality-control desc-in-process-quality-control" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-in-process-quality-control">事中态势感知 · 服务驾驶舱 · 数据链路与三屏方案</title><desc id="desc-in-process-quality-control">数据按指标周期定时同步；三屏及下钻分析属于新版建设方案。；省公司 / 本公司业务系统：多业务来源：清单级 / 统计级数据；定时入湖：源端统计 / 数据汇聚：非实时同步；数据治理与指标计算：指标口径 / 场景标签：跨平台 / 多维计算：日度数据 / 月度指标；服务态势驾驶舱：客户服务量：服务结构与服务占比；S1 企业总览：新版方案：外部 / 监管 / 内部评价：服务结果与变化；S2 客户声音：新版方案：业务 / 受理入口 / 诉求：重点问题与原声听音；S3 专业服务：新版方案：专业条线服务表现：监督检查 / 专项治理；省公司 / 本公司业务系统 · 按指标周期定时同步 · 定时入湖；定时入湖 · 汇聚数据 · 数据治理与指标计算；数据治理与指标计算 · 指标展示 · 服务态势驾驶舱；服务态势驾驶舱 · 企业视角 · S1 企业总览；服务态势驾驶舱 · 客户视角 · S2 客户声音；服务态势驾驶舱 · 专业条线视角 · S3 专业服务</desc><defs><marker id="arrow-in-process-quality-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#bedbf2"/></marker></defs><path d="M390 158 C390 203,390 203,390 248" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-in-process-quality-control)"/><text x="390" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">按指标周期定时同步</text><path d="M390 382 C390 427,390 427,390 472" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-in-process-quality-control)"/><text x="390" y="417" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">汇聚数据</text><path d="M390 606 C390 651,390 651,390 696" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-in-process-quality-control)"/><text x="390" y="641" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">指标展示</text><path d="M390 830 C390 875,146 875,146 920" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="268" y="865"