<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1166" role="img" aria-labelledby="title-in-process-quality-control" aria-describedby="desc-in-process-quality-control" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-in-process-quality-control">事中服务态势驾驶舱 · 批量入湖与指标计算</title><desc id="desc-in-process-quality-control">光点仅示意调用与数据流向，非实时数据。；按周期同步，采用非实时数据链路；图示概括源端统计、入湖、加工和指标计算，具体数据平台产品未展开。新版下钻展示仍属设计方案。；源端数据：多业务源系统，服务记录 / 诉求明细；源端统计处理，明细汇总为统计数据；接入与存储：定时采集与上传，按指标周期同步，批量数据入湖；数据湖表，明细表 / 统计表；数据开发：数据加工，单表统计 / 多表运算，跨来源数据汇总；指标计算，多维聚合 / 占比计算，日数据与月度统计；指标与可视化：指标结果集，周期服务量与结构指标；驾驶舱可视化，TypeScript / React，服务量与结构图表，新版下钻：设计方案；01 多业务源系统 → 源端统计处理：服务明细；02 源端统计处理 → 定时采集与上传：统计级数据；03 多业务源系统 → 定时采集与上传：清单级数据；04 定时采集与上传 → 数据湖表：周期批量入湖；05 数据湖表 → 数据加工：湖表读取；06 数据加工 → 指标计算：加工结果；07 指标计算 → 指标结果集：指标计算结果；08 指标结果集 → 驾驶舱可视化：指标数据展示</desc><style>.architecture-packet{pointer-events:none}svg[data-motion="paused"] .architecture-packet{visibility:hidden}@media(prefers-reduced-motion:reduce){.architecture-packet{display:none}}</style><defs><marker id="arrow-in-process-quality-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="sources"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">源端数据</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">SYSTEM /</tspan><tspan x="24" dy="14.5">STATISTICS</tspan></text></g><g data-layer="ingestion"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y=