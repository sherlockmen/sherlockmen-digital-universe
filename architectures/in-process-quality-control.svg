<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1078" role="img" aria-labelledby="title-in-process-quality-control desc-in-process-quality-control" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-in-process-quality-control">事中服务态势驾驶舱 · 数据展示与分析规划</title><desc id="desc-in-process-quality-control">数据采用非实时定时同步；多视角展示与问题下钻为建设方案。；多来源业务系统：客户服务相关数据；数据汇聚：数据湖接入：非实时定时同步；数据整理与计算：数据口径整理：汇总与指标计算；服务态势展示：服务量：服务结构与占比；整体服务视角（规划）：服务情况与变化；客户问题视角（规划）：问题分布与重点诉求：客户声音；业务服务视角（规划）：业务服务表现：服务改进进展；多来源业务系统 · 定时同步 · 数据汇聚；数据汇聚 · 汇聚数据 · 数据整理与计算；数据整理与计算 · 展示指标 · 服务态势展示；服务态势展示 · 展示规划 · 整体服务视角（规划）；服务态势展示 · 展示规划 · 客户问题视角（规划）；服务态势展示 · 展示规划 · 业务服务视角（规划）</desc><defs><marker id="arrow-in-process-quality-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#bedbf2"/></marker></defs><path d="M390 158 C390 203,390 203,390 248" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-in-process-quality-control)"/><text x="390" y="193" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">定时同步</text><path d="M390 382 C390 427,390 427,390 472" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-in-process-quality-control)"/><text x="390" y="417" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">汇聚数据</text><path d="M390 606 C390 651,390 651,390 696" fill="none" stroke="#bedbf2" stroke-width="1.5" marker-end="url(#arrow-in-process-quality-control)"/><text x="390" y="641" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">展示指标</text><path d="M390 830 C390 875,146 875,146 920" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="268" y="865" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">展示规划</text><path d="M390 830 C390 875,390 875,390 920" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="390" y="865" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">展示规划</text><path d="M390 830 C390 875,634 875,634 920" fill="none" stroke="#657f91" stroke-width="1.5" stroke-dasharray="4 6"/><text x="512" y="865" fill="#a9bac6" font-size="12" text-anchor="middle" stroke="#0a1015" stroke-width="5" paint-order="stroke">展示规划</text><g><rect x="280" y="24" width="220" height="134" rx="4" fill="#0c161f" stroke="#3a5060"/><text x="390" y="54" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="390" dy="0">多来源业务系统</tspan></text><text x="390" y="83" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="390" dy="0">客户服务相关数据</tspan></text></g><g><rect x="280" y="248" width="220" height="134" rx="4" fill="#0c161f" stroke="#3a5060"/><text x="390" y="278" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="390" dy="0">数据汇聚</tspan></text><text x="390" y="307" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="390" dy="0">数据湖接入</tspan><tspan x="390" dy="18">非实时定时同步</tspan></text></g><g><rect x="280" y="472" width="220" height="134" rx="4" fill="#0c161f" stroke="#3a5060"/><text x="390" y="502" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="390" dy="0">数据整理与计算</tspan></text><text x="390" y="531" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="390" dy="0">数据口径整理</tspan><tspan x="390" dy="18">汇总与指标计算</tspan></text></g><g><rect x="280" y="696" width="220" height="134" rx="4" fill="#122332" stroke="#bedbf2"/><text x="390" y="726" fill="#edf4f8" font-size="17" text-anchor="middle"><tspan x="390" dy="0">服务态势展示</tspan></text><text x="390" y="755" fill="#99aebd" font-size="12" text-anchor="middle"><tspan x="390" dy="0">服务量</tspan><tspan x="390" dy="18">服务结构与占比</tspan></text></g><g><rect x="36" y="920" width="220" height="134" rx="4" fill="#0c