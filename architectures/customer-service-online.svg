<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 892" role="img" aria-labelledby="title-customer-service-online desc-customer-service-online" style="font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1015"><title id="title-customer-service-online">在线客服平台 · 会话服务与共享接口</title><desc id="desc-customer-service-online">按已确认能力抽象组件职责；框架、存储与通信选型待补充。；交互接入：在线接待界面，客户咨询 / 坐席回答；服务组件：在线会话服务，承接问题与回答，连接话术查询和服务下单；智能话术查询，根据问题匹配回答话术；共享能力：共享工单接口，服务下单；共享知识服务，客服话术查询；话术知识库，问题与回答内容；01 在线接待界面 ↔ 在线会话服务：咨询消息 / 回答内容；02 在线会话服务 ↔ 智能话术查询：问题输入 / 话术建议；03 在线会话服务 → 共享工单接口：创建服务工单；04 智能话术查询 ↔ 共享知识服务：话术查询 / 匹配结果；05 共享知识服务 ↔ 话术知识库：话术数据读取</desc><defs><marker id="arrow-customer-service-online" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#85a9c2"/></marker></defs><g data-layer="access"><rect x="130" y="16" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="48" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="24" y="74" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">交互接入</tspan></text><text x="24" y="122" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">WEB UI</tspan></text></g><g data-layer="service"><rect x="130" y="228" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="260" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="24" y="286" fill="#d0e2ef" font-size="15" text-anchor="start"><tspan x="24" dy="0">服务组件</tspan></text><text x="24" y="334" fill="#7994a8" font-size="10" text-anchor="start"><tspan x="24" dy="0">SESSION / QUERY</tspan></text></g><g data-layer="shared"><rect x="130" y="440" width="810" height="156" rx="6" fill="#0b141d" stroke="#253541"/><text x="24" y="472" fill="#6f92aa" font-size="11" text-anchor="start"><tspan x="24" dy="0">03</tspan></text><text x="24" y="498" fill="#